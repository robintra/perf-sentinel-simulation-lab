# k3d cluster definition for the perf-sentinel simulation lab.
# Apply with: k3d cluster create --config cluster/k3d-config.yaml
#
# Topology: 1 control plane (server) + 2 workers (agents).
# Traefik and ServiceLB are disabled because the lab does not use an
# Ingress: host access is provided by `scripts/port-forward.sh` running
# `kubectl port-forward` against the relevant ClusterIP services. No k3d
# loadbalancer port mappings are declared on purpose: they would bind
# the host ports without actually routing traffic (no Ingress controller
# behind them) and would conflict with `kubectl port-forward` on strict
# Linux hosts (the CI runner saw "address already in use" before this
# was cleaned up; macOS Docker Desktop is lenient enough to mask it).
# Flannel and the k3s NetworkPolicy controller are disabled so a real
# CNI (Cilium by default, Calico fallback) can take over and enforce
# NetworkPolicy. Without a CNI installed after `k3d cluster create`,
# pods stay Pending. See scripts/install-cni.sh and docs/NETWORK-POLICIES.md.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: perf-sentinel-lab
# Pin the k3s server image to a stable Kubernetes minor. Without an
# explicit pin, k3d picks its bundled default (currently v1.33.6+k3s1
# for k3d v5.8.3). The lab tracks the latest k3s stable.
image: rancher/k3s:v1.35.4-k3s1
servers: 1
agents: 2
kubeAPI:
  host: "0.0.0.0"
  hostIP: "127.0.0.1"
  hostPort: "6443"
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
      - arg: "--disable=servicelb"
        nodeFilters:
          - server:*
      - arg: "--flannel-backend=none"
        nodeFilters:
          - server:*
      - arg: "--disable-network-policy"
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
