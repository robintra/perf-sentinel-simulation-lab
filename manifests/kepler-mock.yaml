---
# Kepler mock for the lab. The real Kepler exporter (CNCF eBPF + perf
# counters) only emits non-zero readings on bare-metal Linux with
# perf_event_paranoid permissive enough to allow per-process counters,
# neither of which is available on the lab nodes. This Python stdlib
# mock stands in for a real Kepler DaemonSet and lets the daemon
# exercise its `[green.kepler]` Prometheus scrape path. The mock
# exposes only `kepler_container_joules_total`, the single metric
# perf-sentinel consumes in `metric_kind = "container"` mode
# (cf upstream parser.rs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kepler-mock-script
  namespace: observability
  labels:
    app.kubernetes.io/name: kepler-mock
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
data:
  app.py: |
    """Minimal Kepler mock exposing /metrics in Prometheus format.

    Serves a cumulative counter per container_name. Each scrape
    increments the counter by a deterministic per-container amount so
    the daemon-side scraper sees real deltas. Stdlib only, same
    reasoning as the Scaphandre mock.
    """
    import sys
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    CONTAINERS = [
        # (container_name as exposed by Kepler, joules per scrape tick)
        ("order-svc", 12.0),
        ("payment-svc", 18.0),
        ("notification-svc", 7.0),
    ]

    STARTUP_EPOCH = time.time()
    COUNTERS = {name: 0.0 for name, _ in CONTAINERS}
    COUNTERS_LOCK = threading.Lock()


    def advance_counters():
        with COUNTERS_LOCK:
            for name, delta in CONTAINERS:
                COUNTERS[name] += delta
            return dict(COUNTERS)


    def render_metrics():
        snapshot = advance_counters()
        lines = [
            "# HELP kepler_container_joules_total Cumulative joules per container - mocked",
            "# TYPE kepler_container_joules_total counter",
        ]
        for name, _ in CONTAINERS:
            lines.append(
                f'kepler_container_joules_total{{container_name="{name}"}} {snapshot[name]:.1f}'
            )
        return "\n".join(lines) + "\n"


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                body = render_metrics().encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            elif self.path == "/healthz":
                uptime = int(time.time() - STARTUP_EPOCH)
                body = f"ok uptime={uptime}s\n".encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            else:
                self.send_error(404, "Not Found")

        def log_message(self, fmt, *args):
            sys.stderr.write(f"{self.address_string()} {fmt % args}\n")


    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 9102), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: kepler-mock
  namespace: observability
  labels:
    app.kubernetes.io/name: kepler-mock
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kepler-mock
  ports:
    - name: http
      port: 9102
      targetPort: 9102
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kepler-mock
  namespace: observability
  labels:
    app.kubernetes.io/name: kepler-mock
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kepler-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kepler-mock
        app.kubernetes.io/part-of: perf-sentinel-lab
        app.kubernetes.io/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          image: python:3.13-alpine@sha256:420cd0bf0f3998275875e02ecd5808168cf0843cbb4d3c536432f729247b2acc  # 3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/scripts/app.py"]
          ports:
            - name: http
              containerPort: 9102
              protocol: TCP
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9102
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9102
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: script
          configMap:
            name: kepler-mock-script
            items:
              - key: app.py
                path: app.py
