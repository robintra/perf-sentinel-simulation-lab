---
apiVersion: v1
kind: ConfigMap
metadata:
  name: perf-sentinel-daemon-config
  namespace: observability
  labels:
    app.kubernetes.io/name: perf-sentinel-daemon
    app.kubernetes.io/part-of: perf-sentinel-lab
data:
  # Override default daemon ports (4317/4318) with 14317/14318 to avoid
  # confusion with the OTel Collector OTLP ports exposed on the host.
  # `environment` only accepts "staging" or "production". We pick
  # "staging" to keep the verbose logging path enabled in the daemon.
  config.toml: |
    [daemon]
    listen_address = "0.0.0.0"
    listen_port_http = 14318
    listen_port_grpc = 14317
    max_active_traces = 10000
    # WARNING: lab-only value. 5 seconds is short enough that any real
    # production trace longer than 5s would be evicted before its child
    # spans arrive, losing the finding. Production deployments must use
    # 30000-60000 ms. See docs/ARCHITECTURE.md "Validation pipeline".
    trace_ttl_ms = 5000
    api_enabled = true
    environment = "staging"

    [daemon.correlation]
    enabled = true
    window_minutes = 5
    lag_threshold_ms = 60000
    min_co_occurrences = 2
    min_confidence = 0.5

    # Ack store introduced in 0.5.20. JSONL appended on POST/DELETE,
    # compacted at startup. Storage path lives on the perf-sentinel-acks
    # PVC mount; the rest of the rootfs stays read-only. No api_key is
    # set: the API binds to a ClusterIP Service so loopback access
    # control is sufficient for the lab.
    [daemon.ack]
    enabled = true
    storage_path = "/var/lib/perf-sentinel/acks.jsonl"

    [detection]
    n_plus_one_min_occurrences = 5
    # Strict mode: require both signals (ORM scope marker AND timing
    # variance CV > 0.5) to reclassify a sanitized SQL group from
    # redundant_sql to n_plus_one_sql. The lab opts in because the
    # default `auto` mode misclassifies the redundant-sql scenario
    # (15 cache-warmed SELECT count(*) via JPA) as n_plus_one_sql:
    # the Hibernate scope marker alone fires the heuristic. With
    # strict, the low timing variance keeps the classification
    # correct. See docs/TROUBLESHOOTING.md.
    sanitizer_aware_classification = "strict"

    [green.electricity_maps]
    # Default v4 endpoint, spelled out so the ConfigMap reads as a
    # usable example for readers learning the integration.
    endpoint = "https://api.electricitymaps.com/v4"
    # `direct` and `5_minutes` are opt-in 0.5.11 knobs that surface as
    # accent chips in the daemon dashboard banner. The Electricity Maps
    # sandbox key silently coarsens the temporal granularity to hourly,
    # but the chip still renders the configured value, which is what we
    # want for the lab. See docs/GREENOPS.md.
    emission_factor_type = "direct"
    temporal_granularity = "5_minutes"

    [green.electricity_maps.region_map]
    # One zone is enough to exercise the mapping without hitting the
    # sandbox key quota. Add more entries when validating multi-region.
    "eu-west-3" = "FR"

    [green.scaphandre]
    # Scaphandre exporter endpoint. RAPL is not accessible on Apple
    # Silicon and most cloud runners, so the lab uses a minimal Python
    # stdlib mock at `manifests/scaphandre-mock.yaml`. The endpoint
    # stays configured at all times: the daemon emits a one-shot warn
    # and falls back to the proxy model when the mock is not yet
    # seeded. Run `make seed-scaphandre-mock` to bring it up.
    endpoint = "http://scaphandre-mock:9100/metrics"
    scrape_interval_secs = 5

    # Per-service typed ProcessMatcher (v0.7.6 form, validated with
    # #[serde(deny_unknown_fields)]). One entry per service actually
    # running in the lab (order, payment, notification), all three on
    # gcr.io/distroless/java25:nonroot — see
    # services/shared-dockerfile/Dockerfile. `exe_contains` is the
    # stable substring of the OpenJDK runtime path that Scaphandre
    # reads from /proc/<pid>/exe (/usr/lib/jvm/java-25-openjdk-amd64/bin/java
    # under distroless, /usr/lib/jvm/.../bin/java on any OpenJDK
    # install). `cmdline_contains` discriminates between the three
    # services that share the runtime; the jar filename is the
    # stable substring the real Scaphandre keeps when concatenating
    # argv without separators.
    [green.scaphandre.process_map."order-service"]
    exe_contains = "bin/java"
    cmdline_contains = "order-service.jar"

    [green.scaphandre.process_map."payment-service"]
    exe_contains = "bin/java"
    cmdline_contains = "payment-service.jar"

    [green.scaphandre.process_map."notification-service"]
    exe_contains = "bin/java"
    cmdline_contains = "notification-service.jar"

    # Multistack services (one entry per stack added during the lab
    # expansion). Each entry uses an `exe_contains` substring matching
    # the runtime path the service's container baked, and a
    # `cmdline_contains` matching the service slug so identical
    # runtimes stay disambiguated. See docs/MULTISTACK.md.
    [green.scaphandre.process_map."quarkus-svc"]
    exe_contains = "bin/java"
    cmdline_contains = "quarkus-svc"

    [green.scaphandre.process_map."mutiny-svc"]
    exe_contains = "bin/java"
    cmdline_contains = "mutiny-svc"

    [green.scaphandre.process_map."helidon-se-svc"]
    exe_contains = "bin/java"
    cmdline_contains = "helidon-se-svc"

    [green.scaphandre.process_map."helidon-mp-svc"]
    exe_contains = "bin/java"
    cmdline_contains = "helidon-mp-svc"

    [green.scaphandre.process_map."dotnet-svc"]
    exe_contains = "share/dotnet"
    cmdline_contains = "dotnet-svc"

    [green.scaphandre.process_map."diesel-svc"]
    exe_contains = "/usr/local/bin/diesel-svc-bin"
    cmdline_contains = "diesel-svc"

    [green.scaphandre.process_map."seaorm-svc"]
    exe_contains = "/usr/local/bin/seaorm-svc-bin"
    cmdline_contains = "seaorm-svc"

    [green.scaphandre.process_map."nest-svc"]
    exe_contains = "bin/node"
    cmdline_contains = "nest-svc"

    [green.scaphandre.process_map."django-svc"]
    exe_contains = "bin/python"
    cmdline_contains = "django-svc"

    [green.scaphandre.process_map."fastapi-svc"]
    exe_contains = "bin/python"
    cmdline_contains = "fastapi-svc"

    [green.scaphandre.process_map."go-svc"]
    exe_contains = "/usr/local/bin/go-svc-bin"
    cmdline_contains = "go-svc"

    [green.scaphandre.process_map."rails-svc"]
    exe_contains = "bin/ruby"
    cmdline_contains = "rails-svc"

    # PHP members run the built-in server (php -S), so the runtime path is
    # bin/php; the service slug disambiguates the two identical runtimes.
    [green.scaphandre.process_map."laravel-svc"]
    exe_contains = "bin/php"
    cmdline_contains = "laravel-svc"

    [green.scaphandre.process_map."symfony-svc"]
    exe_contains = "bin/php"
    cmdline_contains = "symfony-svc"

    [green.kepler]
    # Kepler eBPF exporter scrape path. The real exporter needs
    # bare-metal perf counters which the lab cannot provide, so a
    # Python stdlib mock at manifests/kepler-mock.yaml serves the
    # `kepler_container_cpu_joules_total` counter perf-sentinel
    # consumes in container mode (Kepler v0.10+ name with the
    # `_cpu_` infix; pre-v0.10 mocks are archived in
    # manifests/kepler-mock-legacy.yaml). Scaphandre wins precedence
    # when both are active. Comment this block out to fall through
    # to Kepler if Scaphandre is unreachable.
    endpoint = "http://kepler-mock.observability.svc.cluster.local:9102/metrics"
    scrape_interval_secs = 5
    metric_kind = "container"

    [green.kepler.service_mappings]
    "order-service" = "order-svc"
    "payment-service" = "payment-svc"
    "notification-service" = "notification-svc"

    [green.redfish]
    # Redfish BMC wall-plug wattage scrape. Real BMC hardware is not
    # available in CI, so a Python stdlib mock at
    # manifests/redfish-mock.yaml stands in for two chassis and
    # serves BOTH schemas the v0.7.6 daemon dispatches on (legacy
    # /Power and modern /EnvironmentMetrics). Stays HTTP-only:
    # setting ca_bundle_path would refuse to start because custom-CA
    # TLS is not implemented.
    scrape_interval_secs = 60

    # Per-chassis typed endpoint (v0.7.6 form, validated with
    # #[serde(deny_unknown_fields)]). The `schema` field selects the
    # canonical JSON pointer the parser reads (no operator-typed
    # pointer involved). chassis-1 covers the legacy Power resource
    # still mandatory on every shipping BMC; chassis-2 covers the
    # modern EnvironmentMetrics resource introduced by DMTF 2020.4.
    [green.redfish.endpoints."chassis-1"]
    url = "http://redfish-mock.observability.svc.cluster.local:8000/redfish/v1/Chassis/1/Power"
    schema = "legacy_power"

    [green.redfish.endpoints."chassis-2"]
    url = "http://redfish-mock.observability.svc.cluster.local:8000/redfish/v1/Chassis/2/EnvironmentMetrics"
    schema = "environment_metrics"

    [green.redfish.service_mappings]
    "order-service" = "chassis-1"
    "payment-service" = "chassis-1"
    "notification-service" = "chassis-2"
---
# Ack store backing volume. Single-node k3d uses local-path-provisioner,
# which honors fsGroup on the resulting hostPath mount, so the daemon's
# UID 65534 can write the JSONL file. ReadWriteOnce + Deployment is safe
# because the daemon's strategy is Recreate (line 99): the old pod
# releases the PVC before the new pod claims it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: perf-sentinel-acks
  namespace: observability
  labels:
    app.kubernetes.io/name: perf-sentinel-daemon
    app.kubernetes.io/part-of: perf-sentinel-lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: perf-sentinel-daemon
  namespace: observability
  labels:
    app.kubernetes.io/name: perf-sentinel-daemon
    app.kubernetes.io/part-of: perf-sentinel-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: perf-sentinel-daemon
  ports:
    - name: http
      port: 14318
      targetPort: 14318
      protocol: TCP
    - name: grpc
      port: 14317
      targetPort: 14317
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perf-sentinel-daemon
  namespace: observability
  labels:
    app.kubernetes.io/name: perf-sentinel-daemon
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "0.9.7"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: perf-sentinel-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: perf-sentinel-daemon
        app.kubernetes.io/part-of: perf-sentinel-lab
        app.kubernetes.io/version: "0.9.7"
    spec:
      automountServiceAccountToken: false
      # UID 65534 matches the upstream perf-sentinel scratch image USER.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: perf-sentinel
          image: ghcr.io/robintra/perf-sentinel@sha256:27c971dd5fa45b0b1bd61226c5a871249cb3a217f71dc993e1ed001bbfc60a61  # 0.9.7
          imagePullPolicy: IfNotPresent
          args:
            - watch
            - --config
            - /etc/perf-sentinel/config.toml
          ports:
            - name: http
              containerPort: 14318
              protocol: TCP
            - name: grpc
              containerPort: 14317
              protocol: TCP
          env:
            # Token for the Electricity Maps API. `optional: true` lets the
            # pod start without the Secret: the daemon then falls back to
            # the bundled `annual` carbon intensity source. Run
            # `make seed-electricity-maps` to provision the Secret.
            - name: PERF_SENTINEL_EMAPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: perf-sentinel-electricity-maps
                  key: token
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/perf-sentinel
              readOnly: true
            # The container rootfs stays read-only (see securityContext
            # below); the daemon writes ack JSONL only under this mount.
            - name: acks
              mountPath: /var/lib/perf-sentinel
          # Bump to 512Mi if OOM under load. See docs/RESOURCES.md.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # initialDelaySeconds=20 covers cold image pull from GHCR.
          livenessProbe:
            httpGet:
              path: /health
              port: 14318
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            # Under sustained CPU saturation the cgroup quota freezes the
            # whole process in quanta; a tight liveness budget restarts a
            # functional daemon before queue shedding even engages.
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 14318
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: perf-sentinel-daemon-config
            items:
              - key: config.toml
                path: config.toml
        - name: acks
          persistentVolumeClaim:
            claimName: perf-sentinel-acks
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: perf-sentinel-daemon
  namespace: observability
  labels:
    # The release label matches the kube-prometheus-stack release name
    # used by bootstrap.sh, so the bundled Prometheus picks this up
    # regardless of how the chart's serviceMonitorSelector is configured.
    release: kube-prometheus-stack
    app.kubernetes.io/name: perf-sentinel-daemon
    app.kubernetes.io/part-of: perf-sentinel-lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: perf-sentinel-daemon
  namespaceSelector:
    matchNames:
      - observability
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
