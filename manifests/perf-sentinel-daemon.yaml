---
apiVersion: v1
kind: ConfigMap
metadata:
  name: perf-sentinel-daemon-config
  namespace: observability
  labels:
    app.kubernetes.io/name: perf-sentinel-daemon
    app.kubernetes.io/part-of: perf-sentinel-lab
data:
  # Override default daemon ports (4317/4318) with 14317/14318 to avoid
  # confusion with the OTel Collector OTLP ports exposed on the host.
  # `environment` only accepts "staging" or "production". We pick
  # "staging" to keep the verbose logging path enabled in the daemon.
  config.toml: |
    [daemon]
    listen_address = "0.0.0.0"
    listen_port_http = 14318
    listen_port_grpc = 14317
    max_active_traces = 10000
    # WARNING: lab-only value. 5 seconds is short enough that any real
    # production trace longer than 5s would be evicted before its child
    # spans arrive, losing the finding. Production deployments must use
    # 30000-60000 ms. See docs/ARCHITECTURE.md "Validation pipeline".
    trace_ttl_ms = 5000
    api_enabled = true
    environment = "staging"

    [daemon.correlation]
    enabled = true
    window_minutes = 5
    lag_threshold_ms = 60000
    min_co_occurrences = 2
    min_confidence = 0.5

    [detection]
    n_plus_one_min_occurrences = 5
---
apiVersion: v1
kind: Service
metadata:
  name: perf-sentinel-daemon
  namespace: observability
  labels:
    app.kubernetes.io/name: perf-sentinel-daemon
    app.kubernetes.io/part-of: perf-sentinel-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: perf-sentinel-daemon
  ports:
    - name: http
      port: 14318
      targetPort: 14318
      protocol: TCP
    - name: grpc
      port: 14317
      targetPort: 14317
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perf-sentinel-daemon
  namespace: observability
  labels:
    app.kubernetes.io/name: perf-sentinel-daemon
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "0.5.6"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: perf-sentinel-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: perf-sentinel-daemon
        app.kubernetes.io/part-of: perf-sentinel-lab
        app.kubernetes.io/version: "0.5.6"
    spec:
      automountServiceAccountToken: false
      # UID 65534 matches the upstream perf-sentinel scratch image USER.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: perf-sentinel
          image: ghcr.io/robintra/perf-sentinel:0.5.6
          imagePullPolicy: IfNotPresent
          args:
            - watch
            - --config
            - /etc/perf-sentinel/config.toml
          ports:
            - name: http
              containerPort: 14318
              protocol: TCP
            - name: grpc
              containerPort: 14317
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/perf-sentinel
              readOnly: true
          # Bump to 512Mi if OOM under load. See docs/RESOURCES.md.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # initialDelaySeconds=20 covers cold image pull from GHCR.
          livenessProbe:
            httpGet:
              path: /health
              port: 14318
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 14318
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: perf-sentinel-daemon-config
            items:
              - key: config.toml
                path: config.toml
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: perf-sentinel-daemon
  namespace: observability
  labels:
    # The release label matches the kube-prometheus-stack release name
    # used by bootstrap.sh, so the bundled Prometheus picks this up
    # regardless of how the chart's serviceMonitorSelector is configured.
    release: kube-prometheus-stack
    app.kubernetes.io/name: perf-sentinel-daemon
    app.kubernetes.io/part-of: perf-sentinel-lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: perf-sentinel-daemon
  namespaceSelector:
    matchNames:
      - observability
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
