image:
  repository: order-service
  tag: s2
  pullPolicy: IfNotPresent

service:
  port: 8080

database:
  url: jdbc:postgresql://postgres.db.svc.cluster.local:5432/lab?currentSchema=orders
  username: lab
  password: changeme

messaging:
  host: rabbitmq.messaging.svc.cluster.local
  port: 5672
  slowHost: toxiproxy.messaging.svc.cluster.local
  slowPort: 25672
  toxiproxyApi: http://toxiproxy.messaging.svc.cluster.local:8474

otel:
  serviceName: order-service
  endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  protocol: http/protobuf
  cloudRegion: eu-west-3
  cloudProvider: aws

# The only non-HTTP entry point in the lab: two @Scheduled jobs issuing one
# shared statement, for validating endpoint resolution outside an inbound
# request. Enable with `--set scheduledJobs.enabled=true`.
scheduledJobs:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 800m
    memory: 768Mi

serviceMonitor:
  release: kube-prometheus-stack
  interval: 30s
