spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres.db.svc.cluster.local:5432/lab?currentSchema=orders}
    username: ${DB_USER:lab}
    password: ${DB_PASSWORD:lab}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: order-pool
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Mandatory for the lab. With batch fetching enabled Hibernate
        # collapses lazy lookups into IN queries and the N+1 fault
        # endpoint stops producing N+1 spans.
        default_batch_fetch_size: 0
        format_sql: true
  flyway:
    enabled: true
    schemas: orders
    default-schema: orders
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: order-service

perfsim:
  payment:
    base-url: ${PAYMENT_BASE_URL:http://payment-service.shop.svc.cluster.local:8081}
