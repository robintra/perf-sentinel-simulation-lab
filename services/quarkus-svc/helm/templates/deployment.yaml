apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/part-of: perf-sentinel-lab
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: QUARKUS_HTTP_PORT
              value: {{ .Values.service.port | quote }}
            - name: DB_URL
              value: {{ .Values.database.url | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-db
                  key: password
            - name: SELF_BASE_URL
              value: {{ .Values.selfBaseUrl | quote }}
            # OpenTelemetry: quarkus-opentelemetry extension reads these
            # at startup. No agent attached at runtime, instrumentation
            # is in the application JAR itself.
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=shop,deployment.environment=lab,cloud.region={{ .Values.otel.cloudRegion }},cloud.provider={{ .Values.otel.cloudProvider }}"
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            # OTel SQL statement sanitizer kept at its production
            # default (enabled). The lab daemon's
            # `sanitizer_aware_classification = "strict"` reclassifies
            # the sanitized SQL spans into n_plus_one_sql when both
            # signals are present: an ORM scope marker
            # (org.hibernate.*) AND timing variance CV > 0.5.
            # Hibernate ORM emits the scope marker through
            # quarkus-opentelemetry's auto-instrumentation, so the
            # detector picks up the n+1 pattern despite the literal
            # collapse to `?`. Disabling the sanitizer was tempting
            # for a fast green run but bypasses the real production
            # wiring perf-sentinel is designed for.
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /q/health/live
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
