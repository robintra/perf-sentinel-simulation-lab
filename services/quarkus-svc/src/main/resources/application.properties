# Quarkus stack member of the multistack lab. Configuration mirrors the
# Java baseline (order-service) where reasonable, but uses Quarkus
# idioms instead of Spring Boot equivalents.

quarkus.application.name=quarkus-svc

# HTTP listener: port 8083, per docs/MULTISTACK.md service inventory.
quarkus.http.port=${QUARKUS_HTTP_PORT:8083}
quarkus.http.host=0.0.0.0

# Datasource: shared `lab` Postgres on the cluster, schema `quarkus`.
# Agroal pool size capped at 10 so the pool-saturation fault can
# reproducibly saturate it with concurrency=20.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:quarkus_user}
quarkus.datasource.password=${DB_PASSWORD:lab_quarkus}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://postgres.db.svc.cluster.local:5432/lab?currentSchema=quarkus}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.acquisition-timeout=5S
# Enable OpenTelemetry JDBC instrumentation. Without this, quarkus-opentelemetry
# instruments JAX-RS and RestClient but NOT JDBC, so the SQL-side anti-patterns
# (n_plus_one_sql, redundant_sql, slow_sql, pool_saturation) would emit zero
# JDBC spans and the detectors would see nothing.
quarkus.datasource.jdbc.telemetry=true

# Hibernate ORM. ddl-auto=none: Flyway owns the schema. default_batch_fetch_size=0
# is intentional (matches the Java baseline rationale): batch fetching would
# collapse lazy lookups into IN queries and the n-plus-one-sql fault would
# stop emitting N distinct SQL templates.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.default-schema=quarkus
quarkus.hibernate-orm.jdbc.statement-batch-size=0
quarkus.hibernate-orm.fetch.batch-size=0
quarkus.hibernate-orm.log.sql=false

# Flyway: managed migrations under db/migration/, schema `quarkus`.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=quarkus
quarkus.flyway.default-schema=quarkus
quarkus.flyway.baseline-on-migrate=true

# OpenTelemetry: native Quarkus extension, no Java agent attachment.
# Auto-instruments JAX-RS, JDBC (Agroal), RestClient. Endpoint shape
# identical to Java baseline so the OTel Collector receives traces
# from quarkus-svc the same way it does from order-service.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318}
quarkus.otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
quarkus.otel.traces.sampler=always_on
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none
quarkus.otel.resource.attributes=service.namespace=shop,deployment.environment=lab,cloud.region=eu-west-3,cloud.provider=aws

# REST clients: self-loop for the HTTP-side faults (n-plus-one-http,
# redundant-http, slow-http, fanout, chatty, serialized). The fault
# endpoints call back into this same service's /api/external/mock and
# /api/dispatch/{channel}, so we point the client at localhost.
quarkus.rest-client.self.url=${SELF_BASE_URL:http://localhost:${quarkus.http.port}}

# Health and metrics endpoints. SmallRye Health exposes /q/health/live
# and /q/health/ready; the Kubernetes manifest wires those into the
# liveness/readiness probes.
quarkus.smallrye-health.root-path=/q/health
