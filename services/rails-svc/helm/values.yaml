image:
  repository: rails-svc
  tag: s4
  pullPolicy: IfNotPresent

service:
  port: 8094

database:
  name: lab
  host: postgres.db.svc.cluster.local
  port: "5432"
  username: rails_user
  password: lab_rails

otel:
  serviceName: rails-svc
  endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  protocol: http/protobuf
  cloudRegion: eu-west-3
  cloudProvider: aws

selfBaseUrl: ""

messaging:
  rabbitmqHost: rabbitmq.messaging.svc.cluster.local
  rabbitmqPort: "5672"
  rabbitmqSlowHost: toxiproxy.messaging.svc.cluster.local
  rabbitmqSlowPort: "25672"
  toxiproxyApi: http://toxiproxy.messaging.svc.cluster.local:8474

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 800m
    memory: 512Mi
