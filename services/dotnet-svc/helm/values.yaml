image:
  repository: dotnet-svc
  tag: s1
  pullPolicy: IfNotPresent

service:
  port: 8087

database:
  # Npgsql connection string. Maximum Pool Size=10 makes pool-saturation
  # observable at concurrency=20.
  connectionString: "Host=postgres.db.svc.cluster.local;Port=5432;Database=lab;Username=dotnet_user;Password=lab_dotnet;Search Path=dotnet;Maximum Pool Size=10;Timeout=5"
  username: dotnet_user
  password: lab_dotnet

otel:
  serviceName: dotnet-svc
  endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  protocol: http/protobuf
  cloudRegion: eu-west-3
  cloudProvider: aws

# selfBaseUrl: empty means "derive from service.port at render time"
# (http://localhost:<service.port>). Override explicitly for service-mesh
# routing scenarios.
selfBaseUrl: ""

messaging:
  rabbitmqHost: rabbitmq.messaging.svc.cluster.local
  rabbitmqPort: 5672
  rabbitmqSlowHost: toxiproxy.messaging.svc.cluster.local
  rabbitmqSlowPort: 25672
  toxiproxyApi: http://toxiproxy.messaging.svc.cluster.local:8474

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 800m
    memory: 768Mi
