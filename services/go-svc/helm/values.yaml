image:
  repository: go-svc
  tag: s1
  pullPolicy: IfNotPresent

service:
  port: 8093

database:
  # pgx DSN. pool_max_conns=10 makes pool-saturation observable at
  # concurrency=20. search_path=go (quoted because `go` is a reserved
  # word in Postgres identifier lists in some grammars; pgxpool
  # parses the URL form and passes it through to the connection).
  dsn: "postgres://go_user:lab_go@postgres.db.svc.cluster.local:5432/lab?search_path=%22go%22&pool_max_conns=10"
  username: go_user
  password: lab_go

otel:
  serviceName: go-svc
  endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  protocol: http/protobuf
  cloudRegion: eu-west-3
  cloudProvider: aws

# selfBaseUrl: empty → deployment derives http://localhost:<service.port>.
selfBaseUrl: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
