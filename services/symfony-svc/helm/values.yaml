image:
  repository: symfony-svc
  tag: s1
  pullPolicy: IfNotPresent

service:
  port: 8096
  # PHP built-in server worker count (curl_multi fan-out needs real workers).
  workers: 20

database:
  name: lab
  host: postgres.db.svc.cluster.local
  port: "5432"
  schema: symfony
  username: symfony_user
  password: lab_symfony

# Symfony APP_SECRET (lab-only, not secret-sensitive).
appSecret: 9f2c1a7b4e6d8c0f3a5b7d9e1c2f4a6b

otel:
  serviceName: symfony-svc
  endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  protocol: http/protobuf
  cloudRegion: eu-west-3
  cloudProvider: aws

selfBaseUrl: ""

messaging:
  rabbitmqHost: rabbitmq.messaging.svc.cluster.local
  rabbitmqPort: "5672"
  rabbitmqSlowHost: toxiproxy.messaging.svc.cluster.local
  rabbitmqSlowPort: "25672"
  toxiproxyApi: http://toxiproxy.messaging.svc.cluster.local:8474

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1200m
    memory: 768Mi
