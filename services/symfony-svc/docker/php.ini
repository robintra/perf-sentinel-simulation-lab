; symfony-svc runtime tuning. The opentelemetry extension is already enabled by
; docker-php-ext-enable; this only raises limits for the fault endpoints and keeps
; opcache warm across the built-in server's forked workers.
memory_limit = 256M
max_execution_time = 60
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
