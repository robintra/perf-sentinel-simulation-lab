image:
  repository: django-svc
  tag: s1
  pullPolicy: IfNotPresent

service:
  port: 8091

database:
  name: lab
  host: postgres.db.svc.cluster.local
  port: "5432"
  username: django_user
  password: lab_django

messaging:
  host: rabbitmq.messaging.svc.cluster.local
  port: 5672
  slowHost: toxiproxy.messaging.svc.cluster.local
  slowPort: 25672
  toxiproxyApi: http://toxiproxy.messaging.svc.cluster.local:8474

otel:
  serviceName: django-svc
  endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  protocol: http/protobuf
  cloudRegion: eu-west-3
  cloudProvider: aws

selfBaseUrl: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 800m
    memory: 512Mi
