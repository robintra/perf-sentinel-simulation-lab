image:
  repository: diesel-svc
  tag: s2
  pullPolicy: IfNotPresent

service:
  port: 8088

database:
  url: "postgres://diesel_user:lab_diesel@postgres.db.svc.cluster.local:5432/lab?options=-csearch_path%3Ddiesel%2Cpublic"
  username: diesel_user
  password: lab_diesel

otel:
  serviceName: diesel-svc
  endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  protocol: http/protobuf
  cloudRegion: eu-west-3
  cloudProvider: aws

selfBaseUrl: ""

messaging:
  host: rabbitmq.messaging.svc.cluster.local
  port: 5672
  slowHost: toxiproxy.messaging.svc.cluster.local
  slowPort: 25672
  toxiproxyApi: http://toxiproxy.messaging.svc.cluster.local:8474

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
