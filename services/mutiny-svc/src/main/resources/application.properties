# mutiny-svc: Quarkus + Mutiny reactive stack member of the multistack lab.
# Reproduces the same 10 anti-patterns as quarkus-svc but via the Vert.x
# reactive PgPool instead of Panache/Hibernate over JDBC, so the OTel
# spans exercise the reactive Postgres instrumentation code path.

quarkus.application.name=mutiny-svc

# HTTP listener: port 8084.
quarkus.http.port=${QUARKUS_HTTP_PORT:8084}
quarkus.http.host=0.0.0.0

# Reactive Postgres datasource (used by FaultResource at runtime).
# The pool is capped at 10 so pool-saturation can reproducibly queue
# 10 of 20 concurrent queries.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:mutiny_user}
quarkus.datasource.password=${DB_PASSWORD:lab_mutiny}
quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://postgres.db.svc.cluster.local:5432/lab?search_path=mutiny}
quarkus.datasource.reactive.max-size=10
quarkus.datasource.reactive.idle-timeout=PT30S

# JDBC datasource: only used by Flyway at startup to run schema
# migrations. The reactive datasource cannot run Flyway directly.
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://postgres.db.svc.cluster.local:5432/lab?currentSchema=mutiny}
quarkus.datasource.jdbc.max-size=2

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=mutiny
quarkus.flyway.default-schema=mutiny
quarkus.flyway.baseline-on-migrate=true

# OpenTelemetry: same shape as quarkus-svc. The reactive PG client and
# the reactive REST client both auto-instrument under `quarkus-opentelemetry`.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318}
quarkus.otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
quarkus.otel.traces.sampler=always_on
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none
quarkus.otel.resource.attributes=service.namespace=shop,deployment.environment=lab,cloud.region=eu-west-3,cloud.provider=aws

# Self-loop reactive REST client. HTTP-side faults call back into this
# same service's business endpoints.
quarkus.rest-client.self.url=${SELF_BASE_URL:http://localhost:${quarkus.http.port}}

quarkus.smallrye-health.root-path=/q/health
