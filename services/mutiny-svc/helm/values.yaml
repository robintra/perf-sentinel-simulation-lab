image:
  repository: mutiny-svc
  tag: s2
  pullPolicy: IfNotPresent

service:
  port: 8084

database:
  # Reactive PG client URL (no `jdbc:` prefix). The reactive datasource
  # in application.properties reads from DB_REACTIVE_URL. The JDBC
  # Flyway datasource reads from DB_URL.
  reactiveUrl: postgresql://postgres.db.svc.cluster.local:5432/lab?search_path=mutiny
  url: jdbc:postgresql://postgres.db.svc.cluster.local:5432/lab?currentSchema=mutiny
  username: mutiny_user
  password: lab_mutiny

messaging:
  host: rabbitmq.messaging.svc.cluster.local
  port: 5672
  slowHost: toxiproxy.messaging.svc.cluster.local
  slowPort: 25672
  toxiproxyApi: http://toxiproxy.messaging.svc.cluster.local:8474

otel:
  serviceName: mutiny-svc
  endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  protocol: http/protobuf
  cloudRegion: eu-west-3
  cloudProvider: aws

selfBaseUrl: "http://localhost:8084"

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 800m
    memory: 768Mi
