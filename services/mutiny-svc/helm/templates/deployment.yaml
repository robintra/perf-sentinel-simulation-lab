apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/part-of: perf-sentinel-lab
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: QUARKUS_HTTP_PORT
              value: {{ .Values.service.port | quote }}
            - name: DB_REACTIVE_URL
              value: {{ .Values.database.reactiveUrl | quote }}
            - name: DB_URL
              value: {{ .Values.database.url | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-db
                  key: password
            - name: RABBITMQ_HOST
              value: {{ .Values.messaging.host | quote }}
            - name: RABBITMQ_PORT
              value: {{ .Values.messaging.port | quote }}
            - name: RABBITMQ_SLOW_HOST
              value: {{ .Values.messaging.slowHost | quote }}
            - name: RABBITMQ_SLOW_PORT
              value: {{ .Values.messaging.slowPort | quote }}
            - name: TOXIPROXY_API
              value: {{ .Values.messaging.toxiproxyApi | quote }}
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: SELF_BASE_URL
              value: {{ .Values.selfBaseUrl | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=shop,deployment.environment=lab,cloud.region={{ .Values.otel.cloudRegion }},cloud.provider={{ .Values.otel.cloudProvider }}"
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            # OTel sanitizers kept at their production defaults
            # (enabled). On a service that uses Hibernate ORM, the
            # daemon's `sanitizer_aware_classification = "strict"`
            # reclassifies via the ORM scope marker. mutiny-svc uses
            # the Vert.x reactive PG client directly without an ORM,
            # so the marker is absent and the n_plus_one_sql detector
            # cannot promote the sanitized batch back to n+1, it
            # surfaces as redundant_sql instead. That is a real
            # follow-up for perf-sentinel detection on bare-driver
            # stacks (Vert.x SQL client, pgx, asyncpg, ...).
            # Forcing the sanitizer off here would mask the gap with
            # an unrealistic configuration.
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /q/health/live
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
