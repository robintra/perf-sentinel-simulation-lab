image:
  repository: helidon-se-svc
  tag: s2
  pullPolicy: IfNotPresent

service:
  port: 8085

database:
  url: jdbc:postgresql://postgres.db.svc.cluster.local:5432/lab?currentSchema=helidon_se
  username: helidon_se_user
  password: lab_helidon_se

otel:
  serviceName: helidon-se-svc
  endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  protocol: http/protobuf
  cloudRegion: eu-west-3
  cloudProvider: aws

# selfBaseUrl: empty means "derive from service.port at render time"
# (http://localhost:<service.port>). Override explicitly to send the
# self-loop through a service mesh or a different host.
selfBaseUrl: ""

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 800m
    memory: 768Mi
