# Helidon MP service config. Helidon merges this with the application.yaml.
# MP convention: scalar values live here, structured config in application.yaml.

server.port=${QUARKUS_HTTP_PORT:8086}
server.host=0.0.0.0

mp.openapi.scan.disable=true

# Self-loop REST client base URL. The HTTP-side faults call back into
# this service's own business endpoints.
com.perfsim.helidonmpsvc.web.SelfClient/mp-rest/url=${SELF_BASE_URL:http://localhost:8086}
