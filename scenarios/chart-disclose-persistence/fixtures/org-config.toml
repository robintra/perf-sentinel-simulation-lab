# Minimal org-config for `disclose --intent internal`. Internal intent is a
# validator no-op (draft reports may be incomplete), so this only needs to be
# structurally parseable, not accurate -- unlike scenarios/disclose/fixtures,
# which target `--intent official` and must track the pinned image's CCF
# vintage in specpower_table_version.

[organisation]
name = "Lab Example SAS"
country = "FR"

[organisation.identifiers]
domain = "lab.example.fr"

[methodology]
sci_specification = "ISO/IEC 21031:2024"
enabled_patterns = [
    "n_plus_one_sql",
    "n_plus_one_http",
    "redundant_sql",
    "redundant_http",
]
disabled_patterns = []
conformance = "core-required"

[methodology.calibration]
carbon_intensity_source = "electricity_maps"
specpower_table_version = "2026-04-24"
scaphandre_used = true

[scope_manifest]
total_applications_declared = 1
environments_measured = ["staging"]
