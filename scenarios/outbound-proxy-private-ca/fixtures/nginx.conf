worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
user root;

events {}

http {
  access_log /dev/stdout;
  default_type application/octet-stream;

  server {
    listen 443 ssl;
    server_name tls-origin;
    ssl_certificate     /srv/tls/server.pem;
    ssl_certificate_key /srv/tls/server.key;
    root /srv/www;

    location = /r/redirect {
      return 302 https://tls-origin/r/report.json;
    }
  }
}
