# postgres-exporter for the lab. Exposes pg_stat_statements_seconds_total
# and the rest of postgres_exporter's collectors on :9187, scraped by
# Prometheus via the ServiceMonitor below. Required for the
# perf-sentinel `report --pg-stat-prometheus <url>` path validated by
# scenarios/pg-stat/verify.sh and the panel "Top 10 slow queries" in
# the dashboard-extended.json.
#
# Reuses the lab `lab` user via the existing postgres-credentials
# Secret (`username` + `password` keys). A dedicated read-only role
# would be cleaner in production. The Secret is created by
# scripts/bootstrap.sh from the .postgres-password file.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: db
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/part-of: perf-sentinel-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
        app.kubernetes.io/part-of: perf-sentinel-lab
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          args:
            - "--collector.stat_statements"
          env:
            # postgres-exporter accepts DATA_SOURCE_USER + DATA_SOURCE_PASS
            # + DATA_SOURCE_URI as an alternative to DATA_SOURCE_NAME, which
            # lets us source the password from the existing
            # postgres-credentials Secret instead of duplicating it.
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DATA_SOURCE_URI
              value: "postgres:5432/lab?sslmode=disable"
          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: db
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/part-of: perf-sentinel-lab
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgres-exporter
---
# ServiceMonitor for the kube-prometheus-stack Prometheus operator. The
# `release: kube-prometheus-stack` label is kept for consistency with the
# 3 service ServiceMonitors, even though the lab's KPS values set
# serviceMonitorSelector: {} so any SM in any namespace is picked up
# (helm/values/kube-prometheus-stack.yaml:78-80).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: db
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/part-of: perf-sentinel-lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
