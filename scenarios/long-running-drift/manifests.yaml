---
apiVersion: v1
kind: Namespace
metadata:
  name: long-running-drift
  labels:
    app.kubernetes.io/part-of: perf-sentinel-lab
    pod-security.kubernetes.io/enforce: baseline
    name: long-running-drift
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: long-running-drift-egress
  namespace: long-running-drift
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: perf-sentinel-daemon
      ports:
        - { protocol: TCP, port: 14318 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: perf-sentinel-allow-long-running-drift
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: perf-sentinel-daemon
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: long-running-drift
      ports:
        - { protocol: TCP, port: 14318 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: telemetrygen-drift
  namespace: long-running-drift
  labels:
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/name: telemetrygen-drift
spec:
  parallelism: 2
  completions: 2
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: perf-sentinel-lab
        app.kubernetes.io/name: telemetrygen-drift
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen@sha256:4b60ea340031ce6c62f1043c35b3075f37eb91c01ad313bdb60f862ee4194062
          imagePullPolicy: IfNotPresent
          args:
            - traces
            - --otlp-endpoint=perf-sentinel-daemon.observability.svc.cluster.local:14318
            - --otlp-insecure
            - --otlp-http
            - --rate=${DRIFT_RATE}
            - --duration=${DRIFT_DURATION}
            - --service=drift-svc
            - '--telemetry-attributes=rpc.system="grpc"'
            - '--telemetry-attributes=rpc.service="drift-test"'
            - '--telemetry-attributes=rpc.method="Call"'
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
