# Helm values overlay applied on top of helm/values/otel-collector.yaml.
# Adds Jaeger + Zipkin exporters in parallel to the existing Tempo,
# perf_sentinel and Victoria Traces exporters in the traces pipeline.
#
# Helm replaces lists instead of merging them, so the exporters list below
# must repeat every exporter of the base values. The scenario keeps this
# overlay installed after it runs, and an exporter missing here stops
# feeding its backend for every later scenario (batch-victoria-scrape read
# an empty Victoria Traces after this one until victoria_traces was added).
#
# Apply with:
#   helm upgrade otel-collector open-telemetry/opentelemetry-collector \
#     --version 0.153.0 \
#     -n observability \
#     -f helm/values/otel-collector.yaml \
#     -f scenarios/multiformat-input/collector-overlay.yaml

config:
  exporters:
    otlphttp/jaeger:
      endpoint: http://jaeger.observability.svc.cluster.local:4319
      tls:
        insecure: true
    zipkin:
      endpoint: http://zipkin.observability.svc.cluster.local:9411/api/v2/spans
      tls:
        insecure: true
  service:
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - k8sattributes
          - batch
        exporters:
          - otlphttp/tempo
          - otlphttp/perf_sentinel
          - otlphttp/victoria_traces
          - otlphttp/jaeger
          - zipkin
