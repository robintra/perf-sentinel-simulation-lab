---
# Jaeger all-in-one backend (in-memory storage). Receives OTLP from the
# OTel Collector and exposes the legacy Jaeger query API on port 16686.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: perf-sentinel-lab-b2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: perf-sentinel-lab-b2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: memory
            # Bumped from 5000 to absorb the steady probe traffic without
            # evicting the rich N+1 traces from `make validate-findings`
            # (1500+ requests x 16 spans/trace).
            - name: MEMORY_MAX_TRACES
              value: "50000"
          ports:
            - { name: query,    containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - { name: query,    port: 16686, targetPort: 16686 }
    - { name: otlp-grpc, port: 4317,  targetPort: 4317 }
    - { name: otlp-http, port: 4319,  targetPort: 4318 }
---
# Zipkin backend (in-memory). Single port 9411 for both ingest and query.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: observability
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/part-of: perf-sentinel-lab-b2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zipkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zipkin
        app.kubernetes.io/part-of: perf-sentinel-lab-b2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3.4
          imagePullPolicy: IfNotPresent
          env:
            - name: STORAGE_TYPE
              value: mem
            # Bumped from 20000 to retain the rich N+1 traces under the
            # steady probe traffic that would otherwise FIFO-evict them.
            - name: MEM_MAX_SPANS
              value: "500000"
            - name: JAVA_OPTS
              value: -Xmx1500m -Xms512m
          ports:
            - { name: http, containerPort: 9411 }
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zipkin
  ports:
    - { name: http, port: 9411, targetPort: 9411 }
---
# Allow OTel Collector and Prometheus to reach Jaeger and Zipkin in
# observability (the namespace-wide default-deny-all blocks them
# otherwise).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-allow-internal
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
        - { protocol: TCP, port: 16686 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zipkin-allow-internal
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zipkin
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 9411 }
---
# Additive egress: the existing `otel-collector-egress` only lists Tempo
# and the perf-sentinel daemon as destinations. Extend it for Jaeger
# and Zipkin so the multi-export pipeline can ship traces to all three.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-egress-to-jaeger-zipkin
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zipkin
      ports:
        - { protocol: TCP, port: 9411 }
