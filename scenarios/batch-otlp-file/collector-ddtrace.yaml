# OTel Collector (contrib) config for the headline dd-trace leg: ingest
# dd-trace APM on :8126 via the datadogreceiver, then TEE the converted OTLP
# to the loopback perf-sentinel daemon AND to the file exporter (NDJSON, one
# ExportTraceServiceRequest per line): the backend-less batch path.
# No batch processor: each intake request maps to exactly one NDJSON line,
# which the truncation / mid-stream-garbage legs rely on.
receivers:
  datadog:
    endpoint: 0.0.0.0:8126
exporters:
  otlphttp/ps:
    endpoint: http://host.docker.internal:14396
  file/dump:
    path: /var/otel/otlp-dump.ndjson
service:
  telemetry:
    logs:
      # info so the "Everything is ready" startup banner is emitted, and
      # verify.sh gates readiness on it (same trick as datadog-bridge/live).
      level: info
  pipelines:
    traces:
      receivers: [datadog]
      exporters: [otlphttp/ps, file/dump]
