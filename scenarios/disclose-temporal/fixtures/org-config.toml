# Org-config for v0.8.3 disclose validation.
# specpower_table_version = 2026-04-24 matches the 0.8.3 binary's embedded
# CCF vintage (official-intent drift check). No total_requests_in_period so
# the v1.2 `requests_measured <= total_requests_in_period` rule does not fire
# in C1-C3 (a dedicated variant in C5 adds it to exercise the reject).

[organisation]
name = "Lab Example SAS"
country = "FR"

[organisation.identifiers]
domain = "lab.example.fr"

[methodology]
sci_specification = "ISO/IEC 21031:2024"
enabled_patterns = [
    "n_plus_one_sql",
    "n_plus_one_http",
    "redundant_sql",
    "redundant_http",
]
disabled_patterns = []
conformance = "core-required"

[methodology.calibration]
carbon_intensity_source = "electricity_maps"
specpower_table_version = "2026-04-24"
scaphandre_used = true

[scope_manifest]
total_applications_declared = 10
environments_measured = ["prod"]
