apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-scenario-${SCENARIO_NAME}
  namespace: shop
  labels:
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/component: k6
data:
  scenario.js: |
    ${SCENARIO_BODY}
  common.js: |
    ${COMMON_BODY}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-${SCENARIO_NAME}
  namespace: shop
  labels:
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/component: k6
    perfsim.antiPattern: "${ANTI_PATTERN}"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: perf-sentinel-lab
        app.kubernetes.io/component: k6
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.55.0
          args:
            - run
            - --quiet
            - --no-summary
            - /scripts/scenario.js
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: k6-scenario-${SCENARIO_NAME}
