---
apiVersion: v1
kind: Namespace
metadata:
  name: b3-multi-agent
  labels:
    app.kubernetes.io/part-of: perf-sentinel-lab-b3
    pod-security.kubernetes.io/enforce: baseline
    name: b3-multi-agent
---
# NetworkPolicy egress: telemetrygen Pods need to reach the perf-sentinel
# daemon Service in observability and resolve cluster DNS. The cluster
# wide zero-trust default-deny policy in manifests/network-policies.yaml
# blocks namespace-to-namespace traffic by default, so we explicitly
# allow this namespace's egress to perf-sentinel-daemon:14318 and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: b3-multi-agent-egress
  namespace: b3-multi-agent
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: perf-sentinel-daemon
      ports:
        - { protocol: TCP, port: 14318 }
---
# Reciprocal ingress on the daemon side: the cluster default-deny denies
# ingress from b3-multi-agent unless explicitly allowed. Add a parallel
# ingress rule scoped to this scenario's namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: perf-sentinel-allow-b3-multi-agent
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: perf-sentinel-daemon
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: b3-multi-agent
      ports:
        - { protocol: TCP, port: 14318 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: b3-telemetrygen-load
  namespace: b3-multi-agent
  labels:
    app.kubernetes.io/part-of: perf-sentinel-lab-b3
    app.kubernetes.io/name: telemetrygen-load
spec:
  parallelism: ${PRODUCERS}
  completions: ${PRODUCERS}
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: perf-sentinel-lab-b3
        app.kubernetes.io/name: telemetrygen-load
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen@sha256:4b60ea340031ce6c62f1043c35b3075f37eb91c01ad313bdb60f862ee4194062
          imagePullPolicy: IfNotPresent
          args:
            - traces
            - --otlp-endpoint=perf-sentinel-daemon.observability.svc.cluster.local:14318
            - --otlp-insecure
            - --otlp-http
            - --rate=${RATE_PER_PRODUCER}
            - --duration=${DURATION}
            - --service=b3-load-test-svc
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
