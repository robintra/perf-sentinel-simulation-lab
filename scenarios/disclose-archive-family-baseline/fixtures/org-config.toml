# Org-config for v0.8.2 disclosure validation (manual disclose coverage).
# Mirrors the lab intent-validator fixture, but with
# specpower_table_version set to the v0.8.2 binary's embedded CCF vintage
# date prefix (2026-04-24) so the official-intent specpower-drift check
# passes, and scaphandre_used=true (the lab scores via scaphandre_rapl).

[organisation]
name = "Lab Example SAS"
country = "FR"

[organisation.identifiers]
domain = "lab.example.fr"

[methodology]
sci_specification = "ISO/IEC 21031:2024"
enabled_patterns = [
    "n_plus_one_sql",
    "n_plus_one_http",
    "redundant_sql",
    "redundant_http",
]
disabled_patterns = []
conformance = "core-required"

[methodology.calibration]
carbon_intensity_source = "electricity_maps"
specpower_table_version = "2026-04-24"
scaphandre_used = true

[scope_manifest]
total_applications_declared = 10
environments_measured = ["prod"]
