# Reserved values file for the perf-sentinel daemon.
#
# Sprint S1 deploys the daemon via a hand-written manifest at
# manifests/perf-sentinel-daemon.yaml rather than the upstream Helm chart
# (charts/perf-sentinel/ in the perf-sentinel repo). The manifest path
# stays explicit and avoids wrapping a chart designed for end users.
#
# This file is kept as a placeholder so the directory layout matches the
# brief and so a future sprint can switch to chart-based deployment by
# populating values here. As of S1 it is intentionally empty.
