# Helm values for prometheus-community/kube-prometheus-stack.
#
# Pinned chart version: see KPS_CHART_VERSION in scripts/bootstrap.sh,
# which is the single source of truth. A version written here goes stale.
# Install: helm upgrade --install kube-prometheus-stack \
#   prometheus-community/kube-prometheus-stack \
#   -n observability --version "${KPS_CHART_VERSION}" \
#   -f helm/values/kube-prometheus-stack.yaml

# Alerting is on since perf-sentinel 0.22.0 shipped the alerting half of
# POST /api/incidents. The lab used to trim Alertmanager away, and while it did,
# "a real Alertmanager receiver posts exactly the envelope the daemon accepts"
# was the one link in the incident chain nothing here could check. Thanos and
# the admission webhooks stay trimmed.
alertmanager:
  enabled: true
  alertmanagerSpec:
    # emptyDir: a 24h buffer of lab alerts has no reason to outlive the pod,
    # and one more local-path PVC buys nothing.
    storage: {}
    retention: 24h
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        cpu: 200m
        memory: 128Mi
    # alertmanagerConfigSelector, alertmanagerConfigNamespaceSelector and
    # alertmanagerConfigMatcherStrategy are LEFT AT THE CHART DEFAULTS on
    # purpose. The last one resolves to OnNamespace, which appends a
    # `namespace="<the resource's own namespace>"` matcher to every generated
    # route. Alerts carry the namespace of the OBSERVED workload instead, so
    # the default matches nothing at all, silently: no incident, and no refusal
    # counted anywhere either, because the delivery never leaves. That is the
    # likeliest way an operator's wiring fails, and
    # scenarios/incident-alerting-chain asserts it in both directions rather
    # than configuring the trap away here.
thanosRuler:
  enabled: false
prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
    certManager:
      enabled: false
  tls:
    enabled: false

defaultRules:
  create: false

# kube-state-metrics and node-exporter stay on (used by the cluster
# overview dashboard).
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true

grafana:
  enabled: true
  image:
    # renovate: datasource=docker depName=grafana/grafana
    tag: "13.0.1"
  # Lab credentials. Do not reuse anywhere else.
  adminUser: admin
  adminPassword: admin
  # Infinity datasource for the findings dashboard
  # (manifests/grafana-dashboards/perf-sentinel-findings.json, verbatim upstream
  # examples/grafana-findings-dashboard.json). The chart hands this list to
  # Grafana as GF_PLUGINS_PREINSTALL_SYNC: Grafana downloads it itself at every
  # start, into the storage emptyDir, from grafana.com with a redirect to
  # storage.googleapis.com. Both hosts are opened by the grafana-plugin-egress
  # CiliumNetworkPolicy. Pinned because the four tables' columns come from the
  # plugin's backend parser, and a major bump can empty a table silently.
  plugins:
    - yesoreyeram-infinity-datasource@4.0.0
  # The daemon's read key, expanded by Grafana into the datasource below
  # through $__env{}. Read key only: it opens GET /api/incidents and GET
  # /api/acks and can never POST, DELETE or ack. Same Secret the daemon
  # mounts, created by bootstrap.sh before this chart is installed.
  envValueFrom:
    PERF_SENTINEL_READ_API_KEY:
      secretKeyRef:
        name: perf-sentinel-api-keys
        key: read-api-key
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folder: /tmp/dashboards
      provider:
        foldersFromFilesStructure: false
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
  additionalDataSources:
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
      uid: tempo
      jsonData:
        httpMethod: GET
        tracesToLogs:
          datasourceUid: ""
          tags: ["service.name", "k8s.namespace.name"]
        nodeGraph:
          enabled: true
    # upstream examples/grafana-infinity-datasource.yaml with the lab's
    # Service. Keep the two URLs identical, Infinity refuses any host not in
    # allowedHosts once a header is configured.
    - name: perf-sentinel API
      uid: perf-sentinel-api
      type: yesoreyeram-infinity-datasource
      access: proxy
      isDefault: false
      url: http://perf-sentinel-daemon.observability.svc.cluster.local:14318
      jsonData:
        auth_method: apiKey
        apiKeyKey: X-API-Key
        apiKeyType: header
        allowedHosts:
          - http://perf-sentinel-daemon.observability.svc.cluster.local:14318
        timeoutInSeconds: 30
      secureJsonData:
        apiKeyValue: $__env{PERF_SENTINEL_READ_API_KEY}

prometheus:
  prometheusSpec:
    retention: 7d
    # Pick up every ServiceMonitor in the cluster, regardless of namespace
    # or labels. We pair this with explicit release labels on our own
    # ServiceMonitors so both selection paths work.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    probeSelectorNilUsesHelmValues: false
    probeSelector: {}
    scrapeConfigSelectorNilUsesHelmValues: false
    scrapeConfigSelector: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
  service:
    type: ClusterIP
